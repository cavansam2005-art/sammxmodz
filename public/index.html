<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAMM X MOD WEB - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #00f3ff;
    --secondary: #ff00ea;
    --bg: #05050a;
    --panel: rgba(20, 20, 30, 0.6);
    --border: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --muted: #8a8a9e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.08), transparent 25%);
    background-attachment: fixed;
  }

  /* --- HEADER --- */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; background: rgba(5, 5, 10, 0.8);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    display: flex; align-items: center; gap: 8px;
  }
  .nav-btns { display: flex; gap: 10px; }
  button { font-family: 'Outfit', sans-serif; cursor: pointer; transition: 0.2s; border: none; outline: none; }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 8px; font-weight: 600; }
  .btn-outline:active { background: rgba(0, 243, 255, 0.1); }
  .btn-solid { background: linear-gradient(45deg, var(--secondary), var(--primary)); color: #000; padding: 8px 16px; border-radius: 8px; font-weight: 700; box-shadow: 0 0 15px rgba(255, 0, 234, 0.4); }
  .btn-solid:active { transform: scale(0.95); }

  /* --- MAIN LAYOUT --- */
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  
  /* --- TABS --- */
  .tabs {
    display: flex; background: rgba(255,255,255,0.03); border-radius: 12px;
    padding: 5px; margin-bottom: 25px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600;
    color: var(--muted); border-radius: 8px; transition: 0.3s; cursor: pointer;
  }
  .tab.active {
    background: rgba(0, 243, 255, 0.1); color: var(--primary);
    box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.2);
  }

  /* --- MOD CARDS (GLASSMORPHISM) --- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
  .mod-card {
    background: var(--panel); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    position: relative; overflow: hidden; transition: 0.3s;
    display: flex; flex-direction: column; gap: 12px;
  }
  .mod-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: linear-gradient(to bottom, var(--primary), var(--secondary));
  }
  .mod-card:hover { transform: translateY(-3px); border-color: rgba(0, 243, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  
  .mod-title { font-size: 18px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
  .mod-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  
  .btn-download {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; text-decoration: none; padding: 12px; border-radius: 10px;
    font-weight: 700; margin-top: auto; transition: 0.3s;
  }
  .btn-download:hover { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; border-color: transparent; box-shadow: 0 0 20px rgba(255,0,234,0.4); }

  /* --- PROFILE (AUTHOR) --- */
  .profile-card {
    background: var(--panel); backdrop-filter: blur(15px); border-radius: 20px;
    padding: 30px 20px; border: 1px solid var(--border); text-align: center;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px;
    background: linear-gradient(45deg, var(--secondary), var(--primary));
    display: grid; place-items: center; font-size: 32px; font-weight: 800; color: #000;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
  }
  .bio {
    background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px;
    font-size: 14px; color: #ccc; border-left: 3px solid var(--primary);
    text-align: left; margin-top: 20px; line-height: 1.8;
  }
  
  /* --- MODALS --- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
  }
  .modal-content {
    background: #0f0f18; border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 20px;
    padding: 30px 20px; width: 100%; max-width: 400px; box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
    animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-content h2 { text-align: center; margin-bottom: 25px; font-size: 22px; color: var(--primary); }
  .input-group { margin-bottom: 15px; position: relative; }
  .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .input-group input {
    width: 100%; padding: 14px 15px 14px 45px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(0,0,0,0.5);
    color: #fff; font-size: 15px; outline: none; transition: 0.3s;
  }
  .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,243,255,0.2); }
  .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
  .modal-actions button { flex: 1; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; }

  /* --- FLOATING CHATBOT --- */
  .chatbot-btn {
    position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
    border-radius: 50%; background: linear-gradient(135deg, #0068ff, #00c6ff);
    display: grid; place-items: center; cursor: pointer; z-index: 1000;
    box-shadow: 0 10px 25px rgba(0, 104, 255, 0.5);
    animation: float 3s ease-in-out infinite; transition: 0.3s;
  }
  .chatbot-btn i { font-size: 28px; color: #fff; }
  .chatbot-btn:hover { transform: scale(1.1); }
  @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

  .chatbot-menu {
    position: fixed; bottom: 100px; right: 25px; width: 260px;
    background: rgba(15, 15, 24, 0.95); backdrop-filter: blur(15px);
    border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 16px;
    padding: 15px; display: none; flex-direction: column; gap: 10px; z-index: 1000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8); transform-origin: bottom right;
    animation: popUp 0.3s ease;
  }
  .chatbot-menu a {
    display: flex; align-items: center; gap: 12px; padding: 12px 15px;
    border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px;
    color: #fff; transition: 0.2s;
  }
  .chatbot-menu a i { font-size: 20px; }
  .chatbot-menu a.zalo { background: rgba(0, 104, 255, 0.15); border: 1px solid rgba(0, 104, 255, 0.3); }
  .chatbot-menu a.zalo:hover { background: #0068ff; }
  .chatbot-menu a.group { background: rgba(254, 44, 85, 0.15); border: 1px solid rgba(254, 44, 85, 0.3); }
  .chatbot-menu a.group:hover { background: #fe2c55; }

  /* --- UTILS --- */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  .empty-state i { font-size: 40px; margin-bottom: 15px; opacity: 0.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo"><i class="fa-solid fa-cube"></i> SAMM X MOD</div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-outline" onclick="openLogin()">Đăng nhập</button>
    <button class="btn-solid" onclick="openRegister()">Đăng ký</button>
  </div>
</header>

<div class="container">
  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('home', this)">TRANG CHỦ</div>
    <div class="tab" onclick="switchTab('orders', this)" id="tabOrders" style="display:none;">ĐƠN HÀNG</div>
  </div>

  <!-- TRANG CHỦ -->
  <div id="homeView">
    <div class="grid" id="modsList">
      <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><br>Đang tải kho file...</div>
    </div>
  </div>

  <!-- ĐƠN HÀNG -->
  <div id="ordersView" class="hidden">
    <div class="grid" id="ordersList"></div>
  </div>

  <!-- TÀI KHOẢN -->
  <div id="profileView" class="hidden">
    <div class="profile-card">
      <div class="avatar" id="profileAvatar">S</div>
      <h2 id="profileName" style="font-size: 24px;">SAMM X MODZ</h2>
      <p id="profileAuthor" style="color: var(--primary); font-weight: 600; font-family: 'JetBrains Mono', monospace; margin-top: 5px;">TÁC GIẢ: VAN SAM</p>
      <div class="bio" id="profileBio"></div>
      <button onclick="logout()" style="margin-top: 25px; width: 100%; padding: 14px; background: rgba(255,0,0,0.1); color: #ff4d4f; border: 1px solid #ff4d4f; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s;"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
    </div>
  </div>
</div>

<!-- MODAL AUTH -->
<div class="modal-overlay" id="authModal">
  <div class="modal-content">
    <h2 id="modalTitle">Đăng Nhập</h2>
    <div class="input-group">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="authUser" placeholder="Tên đăng nhập" autocomplete="off">
    </div>
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="authPass" placeholder="Mật khẩu">
    </div>
    <div class="modal-actions">
      <button onclick="closeModal()" style="background: rgba(255,255,255,0.05); color: #fff;">HỦY</button>
      <button onclick="submitAuth()" style="background: linear-gradient(45deg, var(--secondary), var(--primary)); color: #000;" id="modalSubmitBtn">ĐĂNG NHẬP</button>
    </div>
  </div>
</div>

<!-- CHATBOT LIÊN HỆ -->
<div class="chatbot-btn" onclick="toggleChatbot()">
  <i class="fa-solid fa-headset"></i>
</div>
<div class="chatbot-menu" id="chatbotMenu">
  <a href="https://zalo.me/0355757211" target="_blank" class="zalo">
    <i class="fa-solid fa-user-shield"></i> Admin: 0355757211
  </a>
  <a href="https://zalo.me/g/s7dslaz2mkhxgn9dfntj" target="_blank" class="group">
    <i class="fa-solid fa-users"></i> Nhóm SAMM VIP IOS
  </a>
</div>

<script>
  // ĐÃ CẬP NHẬT LINK SERVER MỚI CỦA BẠN
  const SERVER_URL = "https://sammxmodz.onrender.com"; 
  
  let currentUser = localStorage.getItem('samm_user');
  let currentBio = localStorage.getItem('samm_bio');
  let currentAuthor = localStorage.getItem('samm_author');
  let isLoginMode = true;

  // Ghi nhận ID Thiết bị ngầm
  let deviceId = localStorage.getItem('samm_device_id');
  if (!deviceId) {
    deviceId = 'DEV_' + Math.random().toString(36).substring(2, 15).toUpperCase();
    localStorage.setItem('samm_device_id', deviceId);
  }
  fetch(SERVER_URL + '/api/track-device', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ device_id: deviceId })
  }).catch(()=>{});

  function updateUI() {
    const navBtns = document.getElementById('navBtns');
    if (currentUser) {
      navBtns.innerHTML = `<button class="btn-solid" onclick="showProfile()"><i class="fa-solid fa-user-astronaut"></i> ${currentUser}</button>`;
      document.getElementById('tabOrders').style.display = 'block';
    } else {
      navBtns.innerHTML = `
        <button class="btn-outline" onclick="openLogin()">Đăng nhập</button>
        <button class="btn-solid" onclick="openRegister()">Đăng ký</button>
      `;
      document.getElementById('tabOrders').style.display = 'none';
    }
  }
  updateUI();

  async function loadMods() {
    try {
      const res = await fetch(SERVER_URL + '/api/mods');
      const mods = await res.json();
      const list = document.getElementById('modsList');
      
      if (mods.length === 0) {
        list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-box-open"></i><br>Chưa có file mod nào. Admin đang cập nhật...</div>';
        return;
      }

      list.innerHTML = mods.map(m => `
        <div class="mod-card">
          <div class="mod-title">${m.title}</div>
          <div class="mod-meta"><span><i class="fa-solid fa-user-pen"></i> ${m.author}</span> <span><i class="fa-solid fa-weight-hanging"></i> ${m.size}</span></div>
          <div class="mod-meta"><span><i class="fa-regular fa-clock"></i> ${m.date}</span></div>
          <a href="${SERVER_URL}/api/download/${m.id}?username=${currentUser || ''}" class="btn-download" onclick="setTimeout(loadOrders, 1500)"><i class="fa-solid fa-cloud-arrow-down"></i> TẢI XUỐNG NGAY</a>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('modsList').innerHTML = '<div class="empty-state" style="color:#ff4d4f;"><i class="fa-solid fa-triangle-exclamation"></i><br>Lỗi kết nối đến Server!</div>';
    }
  }
  loadMods();

  function switchTab(tabName, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');

    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('ordersView').classList.add('hidden');
    document.getElementById('profileView').classList.add('hidden');

    if (tabName === 'home') {
      document.getElementById('homeView').classList.remove('hidden');
    } else if (tabName === 'orders') {
      document.getElementById('ordersView').classList.remove('hidden');
      loadOrders();
    }
  }

  async function loadOrders() {
    if (!currentUser) return;
    try {
      const res = await fetch(SERVER_URL + '/api/orders/' + currentUser);
      const orders = await res.json();
      const list = document.getElementById('ordersList');
      
      if (orders.length === 0) {
        list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-receipt"></i><br>Bạn chưa tải file nào.</div>';
        return;
      }

      list.innerHTML = orders.map(o => `
        <div class="mod-card">
          <div class="mod-title">${o.title}</div>
          <div class="mod-meta"><span><i class="fa-regular fa-calendar-check"></i> Đã tải: ${o.date}</span></div>
        </div>
      `).join('');
    } catch (e) {}
  }

  function showProfile() {
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('ordersView').classList.add('hidden');
    document.getElementById('profileView').classList.remove('hidden');
    
    document.getElementById('profileName').innerText = currentUser;
    document.getElementById('profileAuthor').innerText = 'TÁC GIẢ: ' + (currentAuthor || 'VAN SAM');
    document.getElementById('profileBio').innerText = currentBio || 'Chào mừng bạn đến với web của chúng tôi.';
  }

  function logout() {
    localStorage.removeItem('samm_user');
    localStorage.removeItem('samm_bio');
    localStorage.removeItem('samm_author');
    location.reload();
  }

  function openLogin() {
    isLoginMode = true;
    document.getElementById('modalTitle').innerText = 'Đăng Nhập';
    document.getElementById('modalSubmitBtn').innerText = 'ĐĂNG NHẬP';
    document.getElementById('authModal').style.display = 'flex';
  }

  function openRegister() {
    isLoginMode = false;
    document.getElementById('modalTitle').innerText = 'Đăng Ký Tài Khoản';
    document.getElementById('modalSubmitBtn').innerText = 'ĐĂNG KÝ';
    document.getElementById('authModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('authModal').style.display = 'none';
  }

  async function submitAuth() {
    const username = document.getElementById('authUser').value.trim();
    const password = document.getElementById('authPass').value.trim();
    if (!username || !password) return alert('Vui lòng nhập đủ thông tin!');

    const endpoint = isLoginMode ? '/api/login' : '/api/register';
    try {
      const res = await fetch(SERVER_URL + endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        if (isLoginMode) {
          localStorage.setItem('samm_user', username);
          localStorage.setItem('samm_bio', data.bio || '');
          localStorage.setItem('samm_author', data.author || '');
          alert('Đăng nhập thành công!');
          location.reload();
        } else {
          alert('Đăng ký thành công! Hãy đăng nhập.');
          openLogin();
        }
      } else {
        alert(data.error);
      }
    } catch (e) {
      alert('Lỗi kết nối Server!');
    }
  }

  function toggleChatbot() {
    const menu = document.getElementById('chatbotMenu');
    menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
  }
</script>

</body>
</html>
