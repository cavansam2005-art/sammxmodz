<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMM X MODZ VIP</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background: radial-gradient(circle at 20% 10%, #2b0f3a 0%, #12051c 60%, #05010a 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:16px; overflow-x:hidden; }
  body::before { content:''; position:fixed; top:-20%; left:-10%; width:60vmax; height:60vmax; background: radial-gradient(circle, rgba(186,85,211,0.15) 0%, transparent 70%); pointer-events:none; z-index:0; }
  .app-container { position:relative; z-index:1; width:100%; max-width:430px; background: linear-gradient(160deg, rgba(35,15,50,0.95), rgba(20,8,30,0.98)); backdrop-filter: blur(14px); border-radius:32px; box-shadow: 0 30px 60px -12px rgba(0,0,0,0.9), 0 0 0 1px rgba(200,100,255,0.25); padding:26px 22px 30px; color:#f5e8ff; max-height:95vh; overflow-y:auto; }
  .app-container::-webkit-scrollbar { width:5px; } .app-container::-webkit-scrollbar-thumb { background:#5a2a7a; border-radius:10px; }
  .app-title { text-align:center; font-size:1.8rem; font-weight:800; letter-spacing:1px; background: linear-gradient(120deg,#f0a8ff 0%,#b04de0 50%,#e07bff 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 22px rgba(180,80,220,0.5); }
  .screen { display:none; flex-direction:column; gap:14px; } .screen.active { display:flex; animation: fadeUp .35s ease; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  .input-group input, .redeem-row input { width:100%; background:#1c0f2b; border:1.5px solid #452a60; border-radius:16px; padding:14px 18px; color:#fff; outline:none; transition:.2s; }
  .input-group input:focus, .redeem-row input:focus { border-color:#b04de0; box-shadow: 0 0 0 3.5px rgba(176,77,224,0.2); }
  .btn { border:none; border-radius:16px; padding:15px; font-weight:700; cursor:pointer; transition:.2s; }
  .btn-primary { background: linear-gradient(135deg,#d87cff,#9b30d9 55%,#6a1b9a); color:#fff; box-shadow: 0 10px 24px -8px rgba(155,48,217,0.7); }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 14px 28px -8px rgba(155,48,217,0.9); }
  .btn-outline { background:transparent; border:1.5px solid #5a2a7a; color:#d0a0e0; }
  .btn-outline:hover { background:#2a1040; border-color:#9b30d9; color:#fff; }
  .user-box { background: linear-gradient(160deg,#2a1035,#1a081f); border-radius:24px; padding:20px; text-align:center; border:1px solid #4a1a5a; position:relative; overflow:hidden; }
  .user-box::after { content:''; position:absolute; top:-60px; right:-60px; width:160px; height:160px; background: radial-gradient(circle, rgba(180,80,220,0.2), transparent 70%); border-radius:50%; }
  .avatar { width:70px; height:70px; margin:0 auto 10px; background: linear-gradient(145deg,#d87cff,#6a1b9a); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:800; color:#fff; position:relative; z-index:1; }
  .points-value { font-size:1.8rem; font-weight:800; color:#d87cff; }
  .section-title { font-size:0.95rem; font-weight:700; color:#d87cff; text-transform:uppercase; margin-top:8px; border-bottom:1px solid #452a60; padding-bottom:5px; }
  .redeem-row { display:flex; gap:8px; } .redeem-row button { background: #9b30d9; color:#fff; border:none; border-radius:14px; padding:0 20px; font-weight:700; cursor:pointer; }
  .topup-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .topup-item { background:#1c0f2b; border:1px solid #452a60; border-radius:14px; padding:12px 6px; text-align:center; cursor:pointer; transition:.2s; }
  .topup-item:hover { border-color:#d87cff; background:#2a1040; }
  .topup-points { font-size:1.1rem; font-weight:800; color:#d87cff; }
  .file-card { background:#1a081f; border:1px solid #3a1545; border-radius:16px; overflow:hidden; margin-bottom:10px; }
  .file-cover { width:100%; height:110px; object-fit:cover; background:#2a1035; display:flex; align-items:center; justify-content:center; font-size:2.4rem; color:#d87cff; }
  .file-body { padding:10px; display:flex; align-items:center; gap:10px; }
  .fi-btn { background: linear-gradient(135deg,#d87cff,#9b30d9); color:#fff; border-radius:10px; padding:8px 14px; text-decoration:none; font-size:0.8rem; font-weight:bold; border:none; cursor:pointer; }
  .contact-btn { background: linear-gradient(135deg,#9b30d9,#6a1b9a); color:#fff; border:none; border-radius:16px; padding:14px; font-weight:700; width:100%; margin-top:10px; cursor:pointer; box-shadow: 0 8px 20px -6px rgba(155,48,217,0.6); }
</style>
</head>
<body>
<div class="app-container">
  <h1 class="app-title">SAMM X MODZ VIP</h1>

  <div id="loginScreen" class="screen active">
    <div class="input-group"><input type="text" id="loginUsername" placeholder="Tên đăng nhập..."></div>
    <div class="input-group"><input type="password" id="loginPassword" placeholder="Mật khẩu..."></div>
    <button class="btn btn-primary" id="loginBtn">ĐĂNG NHẬP</button>
    <div style="text-align:center; color:#c08a8a; font-size:0.85rem;">Chưa có tài khoản? <span id="goToRegister" style="color:#d87cff; cursor:pointer; text-decoration:underline;">Đăng ký</span></div>
    <div id="loginError" style="color:#ff8585; text-align:center; font-size:0.8rem; min-height:18px;"></div>
  </div>

  <div id="registerScreen" class="screen">
    <div class="input-group"><input type="text" id="regUsername" placeholder="Tạo tên đăng nhập..."></div>
    <div class="input-group"><input type="password" id="regPassword" placeholder="Tạo mật khẩu..."></div>
    <button class="btn btn-primary" id="registerBtn">TẠO TÀI KHOẢN</button>
    <div style="text-align:center; color:#c08a8a; font-size:0.85rem;">Đã có tài khoản? <span id="goToLogin" style="color:#d87cff; cursor:pointer; text-decoration:underline;">Đăng nhập</span></div>
    <div id="regError" style="color:#ff8585; text-align:center; font-size:0.8rem; min-height:18px;"></div>
  </div>

  <div id="homeScreen" class="screen">
    <div class="user-box">
      <div class="avatar" id="userAvatar">👑</div>
      <div id="welcomeUsername" style="font-size:1.2rem; font-weight:bold; margin-bottom:10px; position:relative; z-index:1;">User</div>
      <div style="background:rgba(180,80,220,0.15); padding:10px; border-radius:14px; position:relative; z-index:1; border:1px solid rgba(180,80,220,0.3);">
        <div style="font-size:0.7rem; color:#d0a0e0; letter-spacing:1px;">SỐ DƯ ĐIỂM</div>
        <div class="points-value" id="pointsValue">0 <span style="font-size:1rem;">điểm</span></div>
      </div>
    </div>

    <div class="section-title">🎟 Nhập Code nhận điểm</div>
    <div class="redeem-row">
      <input type="text" id="codeInput" placeholder="Nhập code VIP...">
      <button id="redeemBtn">NHẬN</button>
    </div>
    <div id="redeemMsg" style="color:#7ee08a; text-align:center; font-size:0.85rem; min-height:18px;"></div>

    <div class="section-title">💰 Nạp điểm (Liên hệ Zalo)</div>
    <div class="topup-grid">
      <div class="topup-item" onclick="contactZalo('5.000đ', 5)"><div style="font-size:0.75rem; color:#d0a0e0;">5.000đ</div><div class="topup-points">+5</div></div>
      <div class="topup-item" onclick="contactZalo('10.000đ', 10)"><div style="font-size:0.75rem; color:#d0a0e0;">10.000đ</div><div class="topup-points">+10</div></div>
      <div class="topup-item" onclick="contactZalo('20.000đ', 20)"><div style="font-size:0.75rem; color:#d0a0e0;">20.000đ</div><div class="topup-points">+20</div></div>
    </div>

    <div class="section-title">📁 SAMM ĐANG CẬP NHẬP</div>
    <div id="fileList"></div>
    <div id="emptyNote" style="text-align:center; color:#a07070; font-size:0.85rem; padding:10px;">Chưa có file nào.</div>

    <button class="contact-btn" onclick="window.open('https://zalo.me/0355757211', '_blank')">📞 SAMM X MODZ</button>
    <button class="btn btn-outline" id="logoutBtn" style="margin-top:10px;">ĐĂNG XUẤT</button>
  </div>
</div>

<script>
let token = localStorage.getItem('sammx_token') || '';
let currentPoints = 0;
const $ = id => document.getElementById(id);

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(name + 'Screen').classList.add('active');
}
function contactZalo(price, points) {
  alert(`Bạn chọn nạp ${points} điểm (${price}).\nVui lòng nhấn OK để mở Zalo thanh toán và nhận code từ Admin.`);
  window.open('https://zalo.me/0355757211', '_blank');
}
function updatePointsUI(pts) {
  currentPoints = pts;
  $('pointsValue').innerHTML = pts + ' <span style="font-size:1rem;">điểm</span>';
}

async function loadMe(){
  if (!token) return showScreen('login');
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) throw 0;
    const user = await r.json();
    $('welcomeUsername').textContent = user.username;
    $('userAvatar').textContent = user.username.charAt(0).toUpperCase();
    updatePointsUI(user.points);
    showScreen('home');
    loadFiles();
  } catch {
    token = ''; localStorage.removeItem('sammx_token'); showScreen('login');
  }
}

$('loginBtn').onclick = async () => {
  $('loginError').textContent = '';
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('loginUsername').value, password: $('loginPassword').value }) });
  const d = await r.json();
  if (!r.ok) return $('loginError').textContent = d.error;
  token = d.token; localStorage.setItem('sammx_token', token); loadMe();
};

$('registerBtn').onclick = async () => {
  $('regError').textContent = '';
  const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('regUsername').value, password: $('regPassword').value }) });
  const d = await r.json();
  if (!r.ok) return $('regError').textContent = d.error;
  alert('Tạo tài khoản thành công!'); showScreen('login');
};

$('goToRegister').onclick = () => showScreen('register');
$('goToLogin').onclick = () => showScreen('login');
$('logoutBtn').onclick = () => { token=''; localStorage.removeItem('sammx_token'); showScreen('login'); };

$('redeemBtn').onclick = async () => {
  $('redeemMsg').textContent = '';
  const r = await fetch('/api/redeem', { method:'POST', headers:{ 'Authorization': 'Bearer ' + token, 'Content-Type':'application/json' }, body: JSON.stringify({ code: $('codeInput').value }) });
  const d = await r.json();
  if (!r.ok) return $('redeemMsg').style.color = 'red', $('redeemMsg').textContent = d.error;
  $('redeemMsg').style.color = '#7ee08a';
  $('redeemMsg').textContent = `+${d.added} điểm! Tổng: ${d.points} điểm`;
  updatePointsUI(d.points);
  $('codeInput').value = '';
};

async function loadFiles(){
  const r = await fetch('/api/files');
  const files = await r.json();
  const list = $('fileList'); list.innerHTML = '';
  if (!files.length) return $('emptyNote').style.display = 'block';
  $('emptyNote').style.display = 'none';
  files.forEach(f => {
    const img = f.image_path ? `<img src="${f.image_path}" class="file-cover">` : `<div class="file-cover">📄</div>`;
    list.innerHTML += `<div class="file-card">${img}
      <div class="file-body">
        <div style="flex:1; overflow:hidden;">
          <div style="font-weight:bold; font-size:0.85rem; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">${f.name}</div>
          <div style="font-size:0.7rem; color:#d0a0e0;">${(f.size/1024).toFixed(1)} KB • Giá: <b>${f.points} điểm</b></div>
        </div>
        <button class="fi-btn" onclick="buyFile(${f.id}, '${f.name}')">MUA FILE</button>
      </div>
    </div>`;
  });
}

async function buyFile(fileId, fileName) {
  if (!confirm(`Bạn có chắc muốn dùng điểm để mua file: ${fileName}?`)) return;
  const r = await fetch('/api/files/buy', {
    method:'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type':'application/json' },
    body: JSON.stringify({ fileId })
  });
  const d = await r.json();
  if (!r.ok) return alert(d.error);
  updatePointsUI(d.new_points);
  alert('Mua file thành công! Nhấn OK để tải xuống.');
  window.open(d.file_path, '_blank');
}
loadMe();
</script>
</body>
</html>
