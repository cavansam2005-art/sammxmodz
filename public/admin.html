<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN — SAMM X MODZ SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
  body { background: radial-gradient(circle at 10% 20%, #1e0a2e 0%, #0a0212 60%, #030005 100%); color:#f5e8ff; padding:20px 12px; min-height:100vh; overflow-x: hidden; }
  .wrap { max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }
  
  .app-title { text-align: center; font-size: 1.8rem; font-weight: 800; background: linear-gradient(120deg,#f0a8ff 0%,#d87cff 50%,#9b30d9 100%); -webkit-background-clip: text; color: transparent; margin-bottom: 24px; letter-spacing: 1px;}
  
  .panel { background: rgba(25, 10, 40, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(216,124,255,0.25); border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.8); }
  h2 { color: #e0b0ff; font-size: 1.15rem; letter-spacing: 1px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; text-transform: uppercase;}
  h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(216,124,255,0.5), transparent); }
  
  .input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 0.8rem; font-weight: 700; color: #b090c0; }
  
  input[type="text"], input[type="password"], input[type="number"], input[type="file"], select { 
    width: 100%; background: rgba(10, 2, 20, 0.6); border: 1.5px solid rgba(216,124,255,0.3); 
    border-radius: 14px; padding: 15px; color: #fff; font-size: 1rem; outline: none; transition: 0.2s;
  }
  input:focus, select:focus { border-color: #d87cff; box-shadow: 0 0 0 4px rgba(216,124,255,0.15); }
  
  .btn { background: linear-gradient(135deg, #d87cff, #9b30d9); color: #fff; border: none; border-radius: 14px; padding: 16px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; transition: 0.3s; box-shadow: 0 8px 20px -6px rgba(216,124,255,0.5); }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .btn-small { padding: 10px 16px; font-size: 0.85rem; border-radius: 10px; width: auto; }
  .btn-approve { background: linear-gradient(135deg, #4dff88, #00b359); color: #000; }
  .btn-del { background: linear-gradient(135deg, #ff4d4d, #b30000); }
  .btn-edit { background: #6a2a9a; }
  
  /* DANH SÁCH ITEM (File, Topup, User) */
  .item-row { 
    background: rgba(15, 5, 25, 0.8); border: 1px solid rgba(216,124,255,0.2); 
    border-radius: 16px; padding: 16px; margin-bottom: 12px; 
    display: flex; align-items: center; justify-content: space-between; gap: 12px; 
    transition: 0.2s;
  }
  .item-row:hover { border-color: rgba(216,124,255,0.5); background: rgba(30, 10, 45, 0.9); }
  
  .item-info { flex: 1; overflow: hidden; }
  .item-title { font-weight: 800; font-size: 1.05rem; color: #fff; margin-bottom: 4px;}
  .item-sub { font-size: 0.85rem; color: #b090c0; line-height: 1.5;}
  
  /* BADGES */
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; display: inline-block;}
  .bg-pending { background: rgba(255, 204, 0, 0.2); color: #ffcc00; border: 1px solid rgba(255,204,0,0.4);}
  .bg-success { background: rgba(77, 255, 136, 0.15); color: #4dff88; border: 1px solid rgba(77,255,136,0.4);}
  .bg-ios { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3);}
  .bg-android { background: rgba(77, 255, 136, 0.15); color: #4dff88; border: 1px solid rgba(77,255,136,0.3);}
  
  .hidden { display: none !important; }
  
  /* TABS */
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 12px; text-align: center; background: rgba(20,8,30,0.6); border-radius: 12px; cursor: pointer; font-weight: 700; border: 1px solid transparent; }
  .tab.active { background: rgba(216,124,255,0.2); border-color: #d87cff; color: #d87cff; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="app-title">⚙ SHOP ADMIN</h1>

  <!-- ĐĂNG NHẬP -->
  <div id="loginPanel" class="panel">
    <h2>🔐 Đăng nhập</h2>
    <div class="input-group"><label>Tài khoản</label><input type="text" id="adUser" placeholder="admin"></div>
    <div class="input-group"><label>Mật khẩu</label><input type="password" id="adPass" placeholder="admin123"></div>
    <button class="btn" id="loginAdminBtn" style="margin-top: 10px;">ĐĂNG NHẬP</button>
  </div>

  <!-- NỘI DUNG CHÍNH -->
  <div id="adminContent" class="hidden">
    
    <!-- DUYỆT NẠP TIỀN (LUÔN HIỆN ĐẦU TIÊN) -->
    <div class="panel" style="border-color: #ffcc00; box-shadow: 0 0 25px rgba(255,204,0,0.15);">
      <h2 style="color: #ffcc00;">💳 Duyệt Nạp Tiền</h2>
      <div id="topupList">
        <!-- Topups render here -->
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('tab-files', this)">📁 Kho File</div>
      <div class="tab" onclick="switchTab('tab-upload', this)">📤 Đăng Bài</div>
      <div class="tab" onclick="switchTab('tab-users', this)">👥 Users</div>
    </div>

    <!-- TAB KHO FILE -->
    <div id="tab-files" class="panel">
      <h2>📁 Kho File Đã Đăng</h2>
      <div id="fileList"></div>
    </div>

    <!-- TAB ĐĂNG BÀI -->
    <div id="tab-upload" class="panel hidden">
      <h2>📤 Đăng File Mới</h2>
      
      <div class="input-group"><label>Tên File / Tiêu đề</label><input type="text" id="upName" placeholder="VD: Mod FF Max iOS Cực Mượt..."></div>
      
      <div style="display:flex; gap:15px;">
        <div class="input-group" style="flex:1;">
          <label>Hệ Điều Hành</label>
          <select id="upOS">
            <option value="ios">iOS (iPhone/iPad)</option>
            <option value="android">Android</option>
          </select>
        </div>
        <div class="input-group" style="flex:1;">
          <label>Game</label>
          <select id="upGame">
            <option value="ff_max">Free Fire MAX</option>
            <option value="ff_thuong">Free Fire Thường</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:15px;">
        <div class="input-group" style="flex:1;"><label>Giá gốc (Điểm)</label><input type="number" id="upPoints" value="10" min="0"></div>
        <div class="input-group" style="flex:1;"><label>Giá Sale (0 = Không)</label><input type="number" id="upSalePoints" value="0" min="0"></div>
        <div class="input-group" style="flex:1;"><label>Kho (Số lượng)</label><input type="number" id="upStock" value="100" min="0"></div>
      </div>
      
      <div style="border-top: 1px dashed rgba(216,124,255,0.3); padding-top: 15px; margin-bottom: 15px;">
        <div class="input-group">
          <label style="color:#4dff88;">Link Ảnh Bìa (Bắt buộc để đẹp)</label>
          <input type="text" id="upImageUrl" placeholder="https://...">
        </div>
        <div class="input-group">
          <label style="color:#4dff88;">Link File Tải Xuống (Google Drive, Catbox...)</label>
          <input type="text" id="upFileUrl" placeholder="https://...">
        </div>
      </div>
      
      <button class="btn" id="uploadBtn">ĐĂNG BÀI NGAY</button>
    </div>

    <!-- TAB USERS -->
    <div id="tab-users" class="panel hidden">
      <h2>👥 Quản lý Users</h2>
      <div id="userList"></div>
    </div>

    <button class="btn" style="background:transparent; border: 1px solid rgba(255,255,255,0.2); color: #b090c0; margin-bottom: 40px;" onclick="localStorage.removeItem('sammx_admintoken'); location.reload();">ĐĂNG XUẤT ADMIN</button>
  </div>
</div>

<script>
let adToken = localStorage.getItem('sammx_admintoken') || '';
const $ = id => document.getElementById(id);
const auth = () => ({ 'Authorization': 'Bearer ' + adToken });

$('loginAdminBtn').onclick = async () => {
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('adUser').value, password: $('adPass').value }) });
  const d = await r.json(); if (!r.ok) return alert(d.error);
  adToken = d.token; localStorage.setItem('sammx_admintoken', adToken); enterAdmin();
};

function enterAdmin(){
  $('loginPanel').classList.add('hidden'); $('adminContent').classList.remove('hidden');
  loadTopups(); loadFiles(); loadUsers();
  setInterval(loadTopups, 5000); // Tự động load nạp tiền 5s/lần
}

function switchTab(tabId, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => {
    if(p.id.startsWith('tab-')) p.classList.add('hidden');
  });
  $(tabId).classList.remove('hidden');
}

// ================= DUYỆT NẠP TIỀN =================
async function loadTopups() {
  const r = await fetch('/api/admin/topups', { headers: auth() }); const topups = await r.json();
  const pending = topups.filter(t => t.status === 'pending');
  
  if(pending.length === 0) { 
    $('topupList').innerHTML = '<div style="text-align:center; color:#b090c0; font-size:0.95rem; padding: 10px;">Không có yêu cầu nạp tiền nào đang chờ.</div>'; 
    return; 
  }
  
  $('topupList').innerHTML = pending.map(t => `
    <div class="item-row" style="border-left: 4px solid #ffcc00;">
      <div class="item-info">
        <div class="item-title">User: <span style="color:#d87cff;">${t.username}</span></div>
        <div class="item-sub">Nạp: <b>${t.amount.toLocaleString()}đ</b> (${t.points} điểm)<br><span style="font-size:0.75rem; color:#888;">${new Date(t.created_at).toLocaleString()}</span></div>
      </div>
      <button class="btn btn-small btn-approve" onclick="approveTopup(${t.id})">DUYỆT</button>
    </div>
  `).join('');
}

async function approveTopup(id) {
  if(!confirm('Xác nhận đã nhận được tiền và muốn cộng điểm cho user này?')) return;
  const r = await fetch('/api/admin/topups/'+id+'/approve', { method:'POST', headers: auth() });
  if(r.ok) { alert('Đã cộng điểm thành công!'); loadTopups(); loadUsers(); } else alert('Lỗi duyệt!');
}

// ================= ĐĂNG BÀI =================
$('uploadBtn').onclick = async () => {
  if(!$('upName').value.trim()) return alert('Nhập tên file!');
  if(!$('upFileUrl').value.trim()) return alert('Nhập link file tải xuống!');
  
  const fd = new FormData();
  fd.append('name', $('upName').value.trim());
  fd.append('os', $('upOS').value);
  fd.append('game', $('upGame').value);
  fd.append('points', $('upPoints').value);
  fd.append('sale_points', $('upSalePoints').value);
  fd.append('stock', $('upStock').value);
  fd.append('file_url', $('upFileUrl').value.trim());
  if($('upImageUrl').value.trim()) fd.append('image_url', $('upImageUrl').value.trim());
  
  $('uploadBtn').textContent = 'ĐANG XỬ LÝ...';
  const r = await fetch('/api/admin/upload', { method:'POST', headers: auth(), body: fd });
  $('uploadBtn').textContent = 'ĐĂNG BÀI NGAY';
  
  if (r.ok) { 
    alert('Đăng file thành công!'); 
    $('upName').value=''; $('upImageUrl').value=''; $('upFileUrl').value='';
    loadFiles(); 
    switchTab('tab-files', document.querySelectorAll('.tab')[0]); // Chuyển sang tab Kho File
  } else { alert('Lỗi upload!'); }
};

// ================= QUẢN LÝ KHO FILE =================
async function loadFiles(){
  const r = await fetch('/api/files'); const files = await r.json();
  if(files.length === 0) { $('fileList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có file nào.</div>'; return; }
  
  $('fileList').innerHTML = files.map(f => {
    let osBadge = f.os === 'ios' ? '<span class="badge bg-ios">iOS</span>' : '<span class="badge bg-android">ANDROID</span>';
    let gameName = f.game === 'ff_max' ? 'FF MAX' : 'FF THƯỜNG';
    let price = f.sale_points > 0 && f.sale_points < f.points 
      ? `<del style="color:#888;">${f.points}</del> <span style="color:#ff4d4d; font-weight:bold;">${f.sale_points}</span> đ` 
      : `<span style="color:#d87cff; font-weight:bold;">${f.points} đ</span>`;

    return `
    <div class="item-row">
      <div class="item-info">
        <div class="item-title">${f.name}</div>
        <div class="item-sub">${osBadge} <span style="color:#fff; font-weight:bold; margin-left:5px;">${gameName}</span><br>Giá: ${price} • Kho: ${f.stock}</div>
      </div>
      <button class="btn btn-small btn-del" onclick="delFile(${f.id})">XÓA</button>
    </div>
  `}).join('');
}

async function delFile(id) { 
  if(confirm('Bạn có chắc chắn muốn xóa file này khỏi kho?')) { 
    await fetch('/api/admin/files/'+id, {method:'DELETE', headers:auth()}); 
    loadFiles(); 
  } 
}

// ================= QUẢN LÝ USERS =================
async function loadUsers(){
  const r = await fetch('/api/admin/users', { headers: auth() }); const users = await r.json();
  if(users.length === 0) { $('userList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có user.</div>'; return; }
  
  $('userList').innerHTML = users.map(u => `
    <div class="item-row">
      <div class="item-info">
        <div class="item-title">👤 ${u.username}</div>
        <div class="item-sub">📱 Thiết bị: <b style="color:#4dff88;">${u.device || 'Chưa rõ'}</b></div>
      </div>
      <span class="badge bg-success" style="font-size: 0.9rem; padding: 8px 12px;">${u.points} điểm</span>
    </div>
  `).join('');
}

if (adToken) enterAdmin();
</script>
</body>
</html>
