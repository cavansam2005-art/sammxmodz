<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN — SAMM X MODZ VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
  body { background: radial-gradient(circle at 10% 20%, #1e0a2e 0%, #0a0212 60%, #030005 100%); color:#f5e8ff; padding:20px 12px; min-height:100vh; overflow-x: hidden; }
  .wrap { max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }
  .app-title { text-align: center; font-size: 1.7rem; font-weight: 800; background: linear-gradient(120deg,#f0a8ff 0%,#d87cff 50%,#9b30d9 100%); -webkit-background-clip: text; color: transparent; margin-bottom: 24px; }
  .panel { background: rgba(25, 10, 40, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(216,124,255,0.2); border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.7); }
  h2 { color: #e0b0ff; font-size: 1.05rem; letter-spacing: 1.5px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(216,124,255,0.4), transparent); }
  .input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 0.75rem; font-weight: 700; color: #b090c0; text-transform: uppercase; }
  input[type="text"], input[type="password"], input[type="number"], input[type="file"] { width: 100%; background: rgba(10, 2, 20, 0.5); border: 1.5px solid rgba(216,124,255,0.2); border-radius: 14px; padding: 14px 16px; color: #fff; font-size: 0.95rem; outline: none; }
  input:focus { border-color: #d87cff; box-shadow: 0 0 0 4px rgba(216,124,255,0.15); }
  input::file-selector-button { background: rgba(216,124,255,0.15); border: none; color: #d87cff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-right: 12px; }
  .btn { background: linear-gradient(135deg, #d87cff, #9b30d9); color: #fff; border: none; border-radius: 14px; padding: 16px; font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s; }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .btn-small { padding: 8px 12px; font-size: 0.8rem; border-radius: 10px; width: auto; }
  .btn-edit { background: #6a2a9a; } .btn-del { background: #b30000; } .btn-add { background: #0088ff; }
  .file-card { background: rgba(15, 5, 25, 0.6); border: 1px solid rgba(216,124,255,0.15); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
  .file-cover { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; background: #05000a; }
  .file-info { flex: 1; overflow: hidden; }
  .file-name { font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 0.75rem; color: #b090c0; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; }
  .badge-sale { background: rgba(255,77,77,0.2); color: #ff4d4d; padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; }
  .badge-stock { background: rgba(77,255,136,0.1); color: #4dff88; padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; }
  .code-row { display: flex; justify-content: space-between; align-items: center; background: rgba(10,2,20,0.5); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(216,124,255,0.1); gap: 10px;}
  .code-tag { background: rgba(216,124,255,0.1); border: 1px dashed rgba(216,124,255,0.5); color: #e0b0ff; padding: 6px 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
  .user-row { display: flex; justify-content: space-between; align-items: center; background:rgba(15, 5, 25, 0.6); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(216,124,255,0.1); gap: 10px;}
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
  .modal-content { background: #11051c; padding: 28px; border-radius: 24px; width: 100%; max-width: 420px; border: 1px solid rgba(216,124,255,0.3); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="app-title">⚙ SAMM X MODZ ADMIN</h1>

  <div id="loginPanel" class="panel">
    <h2>🔐 Đăng nhập</h2>
    <div class="input-group"><label>Tài khoản</label><input type="text" id="adUser" placeholder="admin"></div>
    <div class="input-group"><label>Mật khẩu</label><input type="password" id="adPass" placeholder="admin123"></div>
    <button class="btn" id="loginAdminBtn">ĐĂNG NHẬP</button>
  </div>

  <div id="adminContent" class="hidden">
    
    <div class="panel" style="border-color: #0088ff; box-shadow: 0 0 20px rgba(0,136,255,0.2);">
      <h2 style="color: #4da6ff;">💸 Nạp điểm cho Thiết bị</h2>
      <p style="font-size: 0.75rem; color: #b090c0; margin-bottom: 12px;">Nhập mã thiết bị (VD: SAMM-XXX-XXX) để cộng điểm trực tiếp cho tài khoản.</p>
      <div style="display:flex; gap:12px;">
        <div class="input-group" style="flex:2; margin:0;"><label>Mã thiết bị</label><input type="text" id="deviceToPoint" placeholder="SAMM-XXX-XXX-XXX"></div>
        <div class="input-group" style="flex:1; margin:0;"><label>Số điểm</label><input type="number" id="pointsToAdd" value="100" min="1"></div>
      </div>
      <button class="btn btn-add" style="margin-top:16px;" onclick="addPointsToDevice()">CỘNG ĐIỂM NGAY</button>
    </div>

    <div class="panel">
      <h2>📤 Đăng file mới</h2>
      <div class="input-group"><label>Tên file hiển thị</label><input type="text" id="upName" placeholder="VD: SAMM X MODZ ALOK iOS..."></div>
      <div style="display:flex; gap:12px;">
        <div class="input-group" style="flex:1;"><label>Giá gốc</label><input type="number" id="upPoints" value="10" min="0"></div>
        <div class="input-group" style="flex:1;"><label>Giá Sale</label><input type="number" id="upSalePoints" value="0" min="0"></div>
        <div class="input-group" style="flex:1;"><label>Kho (SL)</label><input type="number" id="upStock" value="100" min="0"></div>
      </div>
      <div style="border: 1px dashed rgba(216,124,255,0.3); padding: 16px; border-radius: 16px; margin-bottom: 16px;">
        <div class="input-group" style="margin-bottom: 12px;"><label style="color:#ffcc00;">Cách 1: Nhập Link URL</label><input type="text" id="upFileUrl" placeholder="https://..."></div>
        <div class="input-group" style="margin-bottom: 0;"><label style="color:#ffcc00;">Cách 2: Tải file lên</label><input type="file" id="upFile"></div>
      </div>
      <div class="input-group"><label>Ảnh bìa</label><input type="file" id="upImage" accept="image/*"></div>
      <button class="btn" id="uploadBtn" style="margin-top: 10px;">TẢI LÊN / ĐĂNG BÀI</button>
    </div>

    <div class="panel">
      <h2>📁 Kho File đã đăng</h2>
      <div id="fileList"></div>
    </div>

    <div class="panel">
      <h2>🎟 Tạo Code</h2>
      <div style="display:flex; gap:12px; margin-bottom:16px;">
        <div class="input-group" style="flex:1; margin:0;"><label>Số điểm</label><input type="number" id="codePoints" value="5" min="1"></div>
        <div class="input-group" style="flex:1; margin:0;"><label>Số lượng</label><input type="number" id="codeCount" value="1" min="1" max="50"></div>
      </div>
      <button class="btn" id="createCodeBtn">TẠO MÃ CODE</button>
      <div id="newCodes" style="margin-top:16px; text-align:center; display: none;"></div>
    </div>

    <div class="panel">
      <h2>📋 Quản lý Code (Key)</h2>
      <div id="codeList" style="max-height: 300px; overflow-y: auto;"></div>
    </div>

    <div class="panel">
      <h2>👥 Quản lý User & Thiết bị</h2>
      <div id="userList" style="max-height: 350px; overflow-y: auto;"></div>
    </div>
    
    <button class="btn" style="background:#4a1a5a; margin-bottom: 40px;" onclick="localStorage.removeItem('sammx_admintoken'); location.reload();">ĐĂNG XUẤT ADMIN</button>
  </div>
</div>

<!-- MODAL SỬA FILE -->
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h2 style="margin-bottom: 20px; justify-content: center;">✏️ SỬA FILE</h2>
    <input type="hidden" id="editId">
    <div class="input-group"><label>Tên file</label><input type="text" id="editName"></div>
    <div style="display:flex; gap:12px;">
      <div class="input-group" style="flex:1;"><label>Giá gốc</label><input type="number" id="editPoints" min="0"></div>
      <div class="input-group" style="flex:1;"><label>Giá Sale</label><input type="number" id="editSalePoints" min="0"></div>
      <div class="input-group" style="flex:1;"><label>Kho</label><input type="number" id="editStock" min="0"></div>
    </div>
    <div class="input-group" style="margin-top: 16px; border-top: 1px dashed rgba(216,124,255,0.3); padding-top: 16px;">
      <label style="color: #ffcc00;">Thay ảnh bìa mới (Bỏ trống nếu giữ nguyên)</label>
      <input type="file" id="editImage" accept="image/*">
    </div>
    <div style="display:flex; gap:12px; margin-top:24px;">
      <button class="btn btn-edit" onclick="saveEdit()">LƯU LẠI</button>
      <button class="btn btn-del" onclick="closeModal()">HỦY</button>
    </div>
  </div>
</div>

<!-- MODAL SỬA THIẾT BỊ -->
<div id="deviceModal" class="modal hidden">
  <div class="modal-content">
    <h2 style="margin-bottom: 20px; justify-content: center;">📱 SỬA THIẾT BỊ</h2>
    <input type="hidden" id="devUserId">
    <div class="input-group"><label>Mã thiết bị</label><input type="text" id="devName"></div>
    <div style="display:flex; gap:12px; margin-top:20px;">
      <button class="btn btn-edit" onclick="saveDevice()">LƯU LẠI</button>
      <button class="btn btn-del" onclick="closeDeviceModal()">HỦY</button>
    </div>
  </div>
</div>

<script>
let adToken = localStorage.getItem('sammx_admintoken') || '';
const $ = id => document.getElementById(id);
const auth = () => ({ 'Authorization': 'Bearer ' + adToken });

$('loginAdminBtn').onclick = async () => {
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('adUser').value, password: $('adPass').value }) });
  const d = await r.json(); if (!r.ok) return alert(d.error);
  adToken = d.token; localStorage.setItem('sammx_admintoken', adToken); enterAdmin();
};

function enterAdmin(){
  $('loginPanel').classList.add('hidden'); $('adminContent').classList.remove('hidden');
  loadFiles(); loadCodes(); loadUsers();
  
  setInterval(() => { loadUsers(); loadFiles(); }, 5000);
}

async function addPointsToDevice() {
  const device = $('deviceToPoint').value.trim();
  const points = parseInt($('pointsToAdd').value);
  if(!device || !points) return alert('Nhập đủ mã thiết bị và số điểm!');
  
  const r = await fetch('/api/admin/device/points', {
    method: 'POST',
    headers: { ...auth(), 'Content-Type':'application/json' },
    body: JSON.stringify({ device, points })
  });
  const d = await r.json();
  if (r.ok) {
    alert(`Đã cộng ${points} điểm cho thiết bị ${device}!`);
    $('deviceToPoint').value = ''; $('pointsToAdd').value = '100';
    loadUsers();
  } else {
    alert(d.error);
  }
}

$('uploadBtn').onclick = async () => {
  if(!$('upName').value.trim()) return alert('Nhập tên file!');
  if(!$('upFile').files[0] && !$('upFileUrl').value.trim()) return alert('Chọn file hoặc nhập URL!');
  const fd = new FormData();
  fd.append('name', $('upName').value.trim());
  fd.append('points', $('upPoints').value || 0);
  fd.append('sale_points', $('upSalePoints').value || 0);
  fd.append('stock', $('upStock').value || 0);
  if ($('upFileUrl').value.trim()) fd.append('file_url', $('upFileUrl').value.trim());
  if ($('upFile').files[0]) fd.append('file', $('upFile').files[0]);
  if ($('upImage').files[0]) fd.append('image', $('upImage').files[0]);
  
  $('uploadBtn').textContent = 'ĐANG XỬ LÝ...';
  const r = await fetch('/api/admin/upload', { method:'POST', headers: auth(), body: fd });
  $('uploadBtn').textContent = 'TẢI LÊN / ĐĂNG BÀI';
  
  if (r.ok) { 
    alert('Đăng file thành công!'); 
    $('upName').value=''; $('upPoints').value='10'; $('upSalePoints').value='0'; $('upStock').value='100'; $('upFile').value=''; $('upImage').value=''; $('upFileUrl').value='';
    loadFiles(); 
  } else { const d = await r.json(); alert(d.error || 'Lỗi upload!'); }
};

// SỬA LẠI HÀM NÀY ĐỂ KHÔNG BỊ LỖI KHI FILE KHÔNG CÓ ẢNH
async function loadFiles(){
  const r = await fetch('/api/files'); const files = await r.json();
  if(files.length === 0) {
    $('fileList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có file nào.</div>';
    return;
  }
  
  $('fileList').innerHTML = files.map(f => {
    let priceHtml = `<span>${f.points} điểm</span>`;
    if (f.sale_points > 0 && f.sale_points < f.points) {
      priceHtml = `<span style="text-decoration:line-through; color:#888;">${f.points}</span> <span class="badge-sale">SALE ${f.sale_points}</span>`;
    }
    
    // XỬ LÝ AN TOÀN: Nếu có ảnh thì hiện ảnh, không có thì hiện icon
    let imgHtml = '';
    if (f.image_path && f.image_path !== 'null' && f.image_path !== '') {
      imgHtml = `<img src="${f.image_path}" class="file-cover" onerror="this.outerHTML='<div class=file-cover style=display:flex;align-items:center;justify-content:center;font-size:2rem;>📄</div>'">`;
    } else {
      imgHtml = `<div class="file-cover" style="display:flex;align-items:center;justify-content:center;font-size:2rem;">📄</div>`;
    }

    return `
    <div class="file-card">
      ${imgHtml}
      <div class="file-info">
        <div class="file-name">${f.name || 'File chưa có tên'}</div>
        <div class="file-meta"><span>${(f.size/1024).toFixed(1)} KB</span> • <span style="color:#d87cff; font-weight:bold;">${priceHtml}</span> • <span class="badge-stock">Kho: ${f.stock}</span></div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-small btn-edit" onclick="openEdit(${f.id}, '${(f.name || '').replace(/'/g, "\\'")}', ${f.points}, ${f.sale_points || 0}, ${f.stock || 0})">SỬA</button>
        <button class="btn btn-small btn-del" onclick="delFile(${f.id})">XÓA</button>
      </div>
    </div>`;
  }).join('');
}

async function delFile(id) { if(confirm('Xóa file này?')) { await fetch('/api/admin/files/'+id, {method:'DELETE', headers:auth()}); loadFiles(); } }
function openEdit(id, name, points, sale_points, stock) { $('editId').value = id; $('editName').value = name; $('editPoints').value = points; $('editSalePoints').value = sale_points || 0; $('editStock').value = stock || 0; $('editImage').value = ''; $('editModal').classList.remove('hidden'); }
function closeModal() { $('editModal').classList.add('hidden'); }

async function saveEdit() {
  const id = $('editId').value;
  const fd = new FormData();
  fd.append('name', $('editName').value);
  fd.append('points', $('editPoints').value);
  fd.append('sale_points', $('editSalePoints').value);
  fd.append('stock', $('editStock').value);
  if ($('editImage').files[0]) fd.append('image', $('editImage').files[0]);
  
  const r = await fetch('/api/admin/files/' + id, { method: 'PUT', headers: auth(), body: fd });
  if (r.ok) { alert('Cập nhật thành công!'); closeModal(); loadFiles(); } else { alert('Lỗi cập nhật!'); }
}

$('createCodeBtn').onclick = async () => {
  const r = await fetch('/api/admin/codes', { method:'POST', headers:{...auth(), 'Content-Type':'application/json'}, body: JSON.stringify({ points: parseInt($('codePoints').value), count: parseInt($('codeCount').value) }) });
  const d = await r.json();
  if (r.ok) { $('newCodes').style.display = 'block'; $('newCodes').innerHTML = d.codes.map(c => `<span class="code-tag">${c}</span>`).join(''); loadCodes(); }
};

async function loadCodes(){
  const r = await fetch('/api/admin/codes', { headers: auth() }); const codes = await r.json();
  if(codes.length === 0) {
    $('codeList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có code.</div>';
    return;
  }
  $('codeList').innerHTML = codes.map(c => `
    <div class="code-row">
      <div style="flex:1; overflow:hidden;">
        <span class="code-tag">${c.code}</span>
      </div>
      <span style="font-size:0.8rem; color:#b090c0; margin-right:10px; white-space:nowrap;">${c.points} đ ${c.used ? '🔴' : '🟢'}</span>
      <button class="btn btn-small btn-del" onclick="delCode(${c.id})">XÓA</button>
    </div>
  `).join('');
}
async function delCode(id) { if(confirm('Xóa Key này?')) { await fetch('/api/admin/codes/'+id, {method:'DELETE', headers:auth()}); loadCodes(); } }

async function loadUsers(){
  const r = await fetch('/api/admin/users', { headers: auth() }); const users = await r.json();
  if(users.length === 0) {
    $('userList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có user.</div>';
    return;
  }
  $('userList').innerHTML = users.map(u => `
    <div class="user-row">
      <div style="flex:1; overflow:hidden;">
        <div style="font-weight:700; color:#fff;">👤 ${u.username}</div>
        <div style="font-size:0.75rem; color:#b090c0; margin-top:4px;">📱 <b style="color:#d87cff;">${u.device || 'Chưa rõ'}</b></div>
      </div>
      <span style="color:#d87cff; font-weight:800; background:rgba(216,124,255,0.1); padding:6px 12px; border-radius:8px; white-space:nowrap;">${u.points} điểm</span>
      <button class="btn btn-small btn-edit" onclick="openDevice(${u.id}, '${u.device || ''}')">SỬA</button>
    </div>
  `).join('');
}

function openDevice(id, deviceName) {
  $('devUserId').value = id;
  $('devName').value = deviceName;
  $('deviceModal').classList.remove('hidden');
}
function closeDeviceModal() { $('deviceModal').classList.add('hidden'); }

async function saveDevice() {
  const id = $('devUserId').value;
  const device = $('devName').value;
  const r = await fetch('/api/admin/users/' + id + '/device', {
    method: 'PUT',
    headers: { ...auth(), 'Content-Type':'application/json' },
    body: JSON.stringify({ device })
  });
  if (r.ok) { alert('Đã cập nhật thiết bị!'); closeDeviceModal(); loadUsers(); } else { alert('Lỗi!'); }
}

if (adToken) enterAdmin();
</script>
</body>
</html>
