<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN — SAMM X MODZ SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
  body { background: #0a0212; color:#f5e8ff; padding:20px 12px; }
  .wrap { max-width: 700px; margin: 0 auto; }
  .app-title { text-align: center; font-size: 1.7rem; font-weight: 800; color: #d87cff; margin-bottom: 24px; }
  .panel { background: rgba(25, 10, 40, 0.6); border: 1px solid rgba(216,124,255,0.2); border-radius: 24px; padding: 24px; margin-bottom: 20px; }
  h2 { color: #e0b0ff; font-size: 1.05rem; margin-bottom: 20px; border-bottom: 1px solid rgba(216,124,255,0.2); padding-bottom: 10px; }
  .input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 0.75rem; font-weight: 700; color: #b090c0; }
  input[type="text"], input[type="password"], input[type="number"], input[type="file"], select { width: 100%; background: rgba(10, 2, 20, 0.5); border: 1.5px solid rgba(216,124,255,0.2); border-radius: 14px; padding: 14px; color: #fff; outline: none; }
  .btn { background: linear-gradient(135deg, #d87cff, #9b30d9); color: #fff; border: none; border-radius: 14px; padding: 16px; font-weight: 800; cursor: pointer; width: 100%; }
  .btn-small { padding: 8px 12px; font-size: 0.8rem; width: auto; border-radius: 10px; }
  .btn-add { background: #0088ff; } .btn-del { background: #b30000; }
  
  /* LIST */
  .item-row { background: rgba(15, 5, 25, 0.6); padding: 14px; border-radius: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .item-info { flex: 1; overflow: hidden; font-size: 0.9rem; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
  .bg-yellow { background: rgba(255, 204, 0, 0.2); color: #ffcc00; }
  .bg-green { background: rgba(77, 255, 136, 0.2); color: #4dff88; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="app-title">⚙ SHOP ADMIN</h1>

  <div id="loginPanel" class="panel">
    <h2>🔐 Đăng nhập</h2>
    <div class="input-group"><input type="text" id="adUser" placeholder="admin"></div>
    <div class="input-group"><input type="password" id="adPass" placeholder="admin123"></div>
    <button class="btn" id="loginAdminBtn">ĐĂNG NHẬP</button>
  </div>

  <div id="adminContent" class="hidden">
    
    <!-- DUYỆT NẠP TIỀN -->
    <div class="panel">
      <h2>💳 Duyệt Nạp Tiền</h2>
      <div id="topupList"></div>
    </div>

    <!-- ĐĂNG BÀI -->
    <div class="panel">
      <h2>📤 Đăng File Mới</h2>
      <div class="input-group"><label>Tên File</label><input type="text" id="upName" placeholder="VD: Mod FF Max iOS..."></div>
      
      <div style="display:flex; gap:12px;">
        <div class="input-group" style="flex:1;">
          <label>Hệ Điều Hành</label>
          <select id="upOS">
            <option value="ios">iOS</option>
            <option value="android">Android</option>
          </select>
        </div>
        <div class="input-group" style="flex:1;">
          <label>Game</label>
          <select id="upGame">
            <option value="ff_max">Free Fire MAX</option>
            <option value="ff_thuong">Free Fire Thường</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:12px;">
        <div class="input-group" style="flex:1;"><label>Giá gốc (Điểm)</label><input type="number" id="upPoints" value="10"></div>
        <div class="input-group" style="flex:1;"><label>Giá Sale</label><input type="number" id="upSalePoints" value="0"></div>
        <div class="input-group" style="flex:1;"><label>Kho</label><input type="number" id="upStock" value="100"></div>
      </div>
      
      <div class="input-group"><label>Link Ảnh Bìa (Khuyên dùng)</label><input type="text" id="upImageUrl" placeholder="https://..."></div>
      <div class="input-group"><label>Link File tải xuống (Khuyên dùng)</label><input type="text" id="upFileUrl" placeholder="https://..."></div>
      
      <button class="btn" id="uploadBtn" style="margin-top: 10px;">ĐĂNG BÀI</button>
    </div>

    <div class="panel">
      <h2>📁 Kho File Đã Đăng</h2>
      <div id="fileList"></div>
    </div>

    <button class="btn" style="background:#4a1a5a; margin-bottom: 40px;" onclick="localStorage.removeItem('sammx_admintoken'); location.reload();">ĐĂNG XUẤT</button>
  </div>
</div>

<script>
let adToken = localStorage.getItem('sammx_admintoken') || '';
const $ = id => document.getElementById(id);
const auth = () => ({ 'Authorization': 'Bearer ' + adToken });

$('loginAdminBtn').onclick = async () => {
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('adUser').value, password: $('adPass').value }) });
  const d = await r.json(); if (!r.ok) return alert(d.error);
  adToken = d.token; localStorage.setItem('sammx_admintoken', adToken); enterAdmin();
};

function enterAdmin(){
  $('loginPanel').classList.add('hidden'); $('adminContent').classList.remove('hidden');
  loadTopups(); loadFiles();
  setInterval(loadTopups, 5000); // Tự động load nạp tiền mới
}

// DUYỆT NẠP
async function loadTopups() {
  const r = await fetch('/api/admin/topups', { headers: auth() }); const topups = await r.json();
  const pending = topups.filter(t => t.status === 'pending');
  
  if(pending.length === 0) { $('topupList').innerHTML = '<div style="color:#b090c0; font-size:0.9rem;">Không có yêu cầu nạp tiền nào.</div>'; return; }
  
  $('topupList').innerHTML = pending.map(t => `
    <div class="item-row" style="border-left: 3px solid #ffcc00;">
      <div class="item-info">
        <div><b>User:</b> ${t.username} <span class="badge bg-yellow">Chờ duyệt</span></div>
        <div style="color:#d87cff; margin-top:4px;">Nạp ${t.amount.toLocaleString()}đ (${t.points} điểm)</div>
      </div>
      <button class="btn btn-small" style="background:#4dff88; color:#000;" onclick="approveTopup(${t.id})">DUYỆT</button>
    </div>
  `).join('');
}

async function approveTopup(id) {
  if(!confirm('Duyệt yêu cầu nạp này?')) return;
  const r = await fetch('/api/admin/topups/'+id+'/approve', { method:'POST', headers: auth() });
  if(r.ok) { alert('Đã cộng điểm!'); loadTopups(); } else alert('Lỗi!');
}

// ĐĂNG BÀI
$('uploadBtn').onclick = async () => {
  if(!$('upName').value.trim()) return alert('Nhập tên file!');
  if(!$('upFileUrl').value.trim()) return alert('Nhập link file!');
  
  const fd = new FormData();
  fd.append('name', $('upName').value.trim());
  fd.append('os', $('upOS').value);
  fd.append('game', $('upGame').value);
  fd.append('points', $('upPoints').value);
  fd.append('sale_points', $('upSalePoints').value);
  fd.append('stock', $('upStock').value);
  fd.append('file_url', $('upFileUrl').value.trim());
  if($('upImageUrl').value.trim()) fd.append('image_url', $('upImageUrl').value.trim());
  
  $('uploadBtn').textContent = 'ĐANG XỬ LÝ...';
  const r = await fetch('/api/admin/upload', { method:'POST', headers: auth(), body: fd });
  $('uploadBtn').textContent = 'ĐĂNG BÀI';
  
  if (r.ok) { 
    alert('Đăng file thành công!'); 
    $('upName').value=''; $('upImageUrl').value=''; $('upFileUrl').value='';
    loadFiles(); 
  } else { alert('Lỗi upload!'); }
};

// DANH SÁCH FILE
async function loadFiles(){
  const r = await fetch('/api/files'); const files = await r.json();
  $('fileList').innerHTML = files.map(f => `
    <div class="item-row">
      <div class="item-info">
        <div style="font-weight:bold;">${f.name}</div>
        <div style="font-size:0.75rem; color:#b090c0;">${f.os.toUpperCase()} • ${f.game} • Giá: ${f.points} đ • Kho: ${f.stock}</div>
      </div>
      <button class="btn btn-small btn-del" onclick="delFile(${f.id})">XÓA</button>
    </div>
  `).join('');
}

async function delFile(id) { if(confirm('Xóa file này?')) { await fetch('/api/admin/files/'+id, {method:'DELETE', headers:auth()}); loadFiles(); } }

if (adToken) enterAdmin();
</script>
</body>
</html>
