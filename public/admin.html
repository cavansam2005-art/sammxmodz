<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN — SAMM X MODZ SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
  body { background: #0a0212; color:#f5e8ff; padding:20px 12px; min-height:100vh; }
  .wrap { max-width: 650px; margin: 0 auto; }
  
  .app-title { text-align: center; font-size: 1.7rem; font-weight: 800; background: linear-gradient(120deg,#f0a8ff 0%,#d87cff 50%,#9b30d9 100%); -webkit-background-clip: text; color: transparent; margin-bottom: 24px; }
  
  .panel { background: rgba(25, 10, 40, 0.7); border: 1px solid rgba(216,124,255,0.2); border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.8); }
  h2 { color: #e0b0ff; font-size: 1.1rem; margin-bottom: 20px; border-bottom: 1px solid rgba(216,124,255,0.2); padding-bottom: 10px; font-weight: 700; letter-spacing: 1px;}
  
  .input-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 0.8rem; font-weight: 700; color: #b090c0; }
  input[type="text"], input[type="password"], input[type="number"], select { width: 100%; background: rgba(10, 2, 20, 0.6); border: 1.5px solid rgba(216,124,255,0.3); border-radius: 14px; padding: 15px; color: #fff; outline: none; font-size: 1rem;}
  input:focus, select:focus { border-color: #d87cff; box-shadow: 0 0 0 4px rgba(216,124,255,0.15); }
  
  .btn { background: linear-gradient(135deg, #d87cff, #9b30d9); color: #fff; border: none; border-radius: 14px; padding: 16px; font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; transition: 0.3s; box-shadow: 0 8px 20px -6px rgba(216,124,255,0.4);}
  .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .btn-small { padding: 8px 12px; font-size: 0.8rem; border-radius: 10px; width: auto; }
  
  .btn-approve { background: linear-gradient(135deg, #4dff88, #00b359); color: #000; }
  .btn-del { background: linear-gradient(135deg, #ff4d4d, #b30000); }
  .btn-edit { background: #6a2a9a; }
  
  /* TABS */
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;}
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1; padding: 12px; text-align: center; background: rgba(20,8,30,0.6); border-radius: 12px; cursor: pointer; font-weight: 700; border: 1px solid transparent; white-space: nowrap; font-size: 0.9rem; color: #b090c0;}
  .tab.active { background: rgba(216,124,255,0.15); border-color: #d87cff; color: #d87cff; }
  
  /* ITEM ROW */
  .item-row { background: rgba(15, 5, 25, 0.8); border: 1px solid rgba(216,124,255,0.2); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .item-info { flex: 1; overflow: hidden; }
  .item-title { font-weight: 800; font-size: 1rem; color: #fff; margin-bottom: 4px;}
  .item-sub { font-size: 0.8rem; color: #b090c0; line-height: 1.5;}
  
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; }
  .bg-pending { background: rgba(255, 204, 0, 0.2); color: #ffcc00; }
  .bg-success { background: rgba(77, 255, 136, 0.15); color: #4dff88; }
  
  .hidden { display: none !important; }

  /* MODAL SỬA ĐIỂM */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
  .modal-content { background: #11051c; padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(216,124,255,0.3); }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="app-title">⚙ SHOP ADMIN</h1>

  <!-- ĐĂNG NHẬP -->
  <div id="loginPanel" class="panel">
    <h2>🔐 Đăng nhập</h2>
    <div class="input-group"><label>Tài khoản</label><input type="text" id="adUser" placeholder="admin"></div>
    <div class="input-group"><label>Mật khẩu</label><input type="password" id="adPass" placeholder="admin123"></div>
    <button class="btn" id="loginAdminBtn">ĐĂNG NHẬP</button>
  </div>

  <!-- NỘI DUNG ADMIN -->
  <div id="adminContent" class="hidden">
    
    <!-- TAB MENU -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('tab-topup', this)">💳 Duyệt Nạp</div>
      <div class="tab" onclick="switchTab('tab-files', this)">📁 Kho File</div>
      <div class="tab" onclick="switchTab('tab-upload', this)">📤 Đăng Bài</div>
      <div class="tab" onclick="switchTab('tab-users', this)">👥 Users</div>
    </div>

    <!-- TAB 1: DUYỆT NẠP -->
    <div id="tab-topup" class="panel">
      <h2>💳 Duyệt Nạp Tiền</h2>
      <div id="topupList"></div>
    </div>

    <!-- TAB 2: KHO FILE -->
    <div id="tab-files" class="panel hidden">
      <h2>📁 Kho File Đã Đăng</h2>
      <div id="fileList"></div>
    </div>

    <!-- TAB 3: ĐĂNG BÀI -->
    <div id="tab-upload" class="panel hidden">
      <h2>📤 Đăng File Mới</h2>
      <div class="input-group"><label>Tên File</label><input type="text" id="upName" placeholder="VD: Mod FF Max iOS..."></div>
      <div style="display:flex; gap:15px;">
        <div class="input-group" style="flex:1;">
          <label>Hệ Điều Hành</label>
          <select id="upOS"><option value="ios">iOS</option><option value="android">Android</option></select>
        </div>
        <div class="input-group" style="flex:1;">
          <label>Game</label>
          <select id="upGame"><option value="ff_max">Free Fire MAX</option><option value="ff_thuong">Free Fire Thường</option></select>
        </div>
      </div>
      <div style="display:flex; gap:15px;">
        <div class="input-group" style="flex:1;"><label>Giá gốc (Điểm)</label><input type="number" id="upPoints" value="10"></div>
        <div class="input-group" style="flex:1;"><label>Giá Sale</label><input type="number" id="upSalePoints" value="0"></div>
        <div class="input-group" style="flex:1;"><label>Kho</label><input type="number" id="upStock" value="100"></div>
      </div>
      <div class="input-group"><label style="color:#4dff88;">Link Ảnh Bìa</label><input type="text" id="upImageUrl" placeholder="https://..."></div>
      <div class="input-group"><label style="color:#4dff88;">Link File Tải Xuống</label><input type="text" id="upFileUrl" placeholder="https://..."></div>
      <button class="btn" id="uploadBtn">ĐĂNG BÀI NGAY</button>
    </div>

    <!-- TAB 4: USERS -->
    <div id="tab-users" class="panel hidden">
      <h2>👥 Quản lý Users</h2>
      <div id="userList"></div>
    </div>

    <button class="btn" style="background:transparent; border: 1px solid rgba(255,255,255,0.2); color: #b090c0; margin-bottom: 40px;" onclick="localStorage.removeItem('sammx_admintoken'); location.reload();">ĐĂNG XUẤT ADMIN</button>
  </div>
</div>

<!-- MODAL SỬA SỐ ĐIỂM -->
<div id="editPointsModal" class="modal hidden">
  <div class="modal-content">
    <h2 style="text-align:center;">💰 SỬA SỐ ĐIỂM</h2>
    <input type="hidden" id="editUserId">
    <div class="input-group" style="margin-top: 15px;">
      <label>Tên User</label>
      <input type="text" id="editUserName" disabled style="opacity: 0.6;">
    </div>
    <div class="input-group">
      <label>Số điểm mới (Ghi đè)</label>
      <input type="number" id="editUserPoints">
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-edit" onclick="saveUserPoints()">LƯU LẠI</button>
      <button class="btn btn-del" onclick="closeModal()">HỦY</button>
    </div>
  </div>
</div>

<script>
let adToken = localStorage.getItem('sammx_admintoken') || '';
const $ = id => document.getElementById(id);
const auth = () => ({ 'Authorization': 'Bearer ' + adToken });

$('loginAdminBtn').onclick = async () => {
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('adUser').value, password: $('adPass').value }) });
  const d = await r.json(); if (!r.ok) return alert(d.error);
  adToken = d.token; localStorage.setItem('sammx_admintoken', adToken); enterAdmin();
};

function enterAdmin(){
  $('loginPanel').classList.add('hidden'); $('adminContent').classList.remove('hidden');
  loadTopups(); loadFiles(); loadUsers();
  setInterval(loadTopups, 5000); // Tự động load nạp tiền 5s/lần
}

function switchTab(tabId, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => { if(p.id.startsWith('tab-')) p.classList.add('hidden'); });
  $(tabId).classList.remove('hidden');
}

// ================= DUYỆT NẠP TIỀN =================
async function loadTopups() {
  const r = await fetch('/api/admin/topups', { headers: auth() }); const topups = await r.json();
  const pending = topups.filter(t => t.status === 'pending');
  
  if(pending.length === 0) { 
    $('topupList').innerHTML = '<div style="text-align:center; color:#b090c0; font-size:0.95rem; padding: 10px;">Không có yêu cầu nạp tiền nào đang chờ.</div>'; 
    return; 
  }
  
  $('topupList').innerHTML = pending.map(t => `
    <div class="item-row" style="border-left: 4px solid #ffcc00;">
      <div class="item-info">
        <div class="item-title">User: <span style="color:#d87cff;">${t.username}</span></div>
        <div class="item-sub">Nạp: <b>${t.amount.toLocaleString()}đ</b> (${t.points} điểm)</div>
      </div>
      <button class="btn btn-small btn-approve" onclick="approveTopup(${t.id})">DUYỆT</button>
    </div>
  `).join('');
}

async function approveTopup(id) {
  if(!confirm('Xác nhận đã nhận được tiền và muốn cộng điểm cho user này?')) return;
  const r = await fetch('/api/admin/topups/'+id+'/approve', { method:'POST', headers: auth() });
  if(r.ok) { alert('Đã cộng điểm thành công!'); loadTopups(); loadUsers(); } else alert('Lỗi duyệt!');
}

// ================= QUẢN LÝ KHO FILE =================
async function loadFiles(){
  const r = await fetch('/api/files'); const files = await r.json();
  if(files.length === 0) { $('fileList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có file nào.</div>'; return; }
  
  $('fileList').innerHTML = files.map(f => {
    let gameName = f.game === 'ff_max' ? 'FF MAX' : 'FF THƯỜNG';
    return `
    <div class="item-row">
      <div class="item-info">
        <div class="item-title">${f.name}</div>
        <div class="item-sub">${f.os.toUpperCase()} • ${gameName}<br>Giá: <span style="color:#d87cff; font-weight:bold;">${f.points} đ</span> • Kho: ${f.stock}</div>
      </div>
      <button class="btn btn-small btn-del" onclick="delFile(${f.id})">XÓA</button>
    </div>
  `}).join('');
}

async function delFile(id) { 
  if(confirm('Bạn có chắc chắn muốn xóa file này khỏi kho?')) { 
    await fetch('/api/admin/files/'+id, {method:'DELETE', headers:auth()}); 
    loadFiles(); 
  } 
}

// ================= ĐĂNG BÀI =================
$('uploadBtn').onclick = async () => {
  if(!$('upName').value.trim()) return alert('Nhập tên file!');
  if(!$('upFileUrl').value.trim()) return alert('Nhập link file tải xuống!');
  
  const fd = new FormData();
  fd.append('name', $('upName').value.trim());
  fd.append('os', $('upOS').value);
  fd.append('game', $('upGame').value);
  fd.append('points', $('upPoints').value);
  fd.append('sale_points', $('upSalePoints').value);
  fd.append('stock', $('upStock').value);
  fd.append('file_url', $('upFileUrl').value.trim());
  if($('upImageUrl').value.trim()) fd.append('image_url', $('upImageUrl').value.trim());
  
  $('uploadBtn').textContent = 'ĐANG XỬ LÝ...';
  const r = await fetch('/api/admin/upload', { method:'POST', headers: auth(), body: fd });
  $('uploadBtn').textContent = 'ĐĂNG BÀI NGAY';
  
  if (r.ok) { 
    alert('Đăng file thành công!'); 
    $('upName').value=''; $('upImageUrl').value=''; $('upFileUrl').value='';
    loadFiles(); 
    switchTab('tab-files', document.querySelectorAll('.tab')[1]);
  } else { alert('Lỗi upload!'); }
};

// ================= QUẢN LÝ USERS =================
async function loadUsers(){
  const r = await fetch('/api/admin/users', { headers: auth() }); const users = await r.json();
  if(users.length === 0) { $('userList').innerHTML = '<div style="text-align:center; color:#b090c0; padding:10px;">Chưa có user.</div>'; return; }
  
  $('userList').innerHTML = users.map(u => `
    <div class="item-row">
      <div class="item-info">
        <div class="item-title">👤 ${u.username}</div>
        <div class="item-sub">Điểm: <span style="color:#4dff88; font-weight:bold;">${u.points}</span><br>Thiết bị: ${u.device || 'Chưa rõ'}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-small btn-edit" onclick="openEditPoints(${u.id}, '${u.username}', ${u.points})">SỬA ĐIỂM</button>
        <button class="btn btn-small btn-del" onclick="delUser(${u.id})">XÓA</button>
      </div>
    </div>
  `).join('');
}

// HÀM SỬA ĐIỂM
function openEditPoints(id, username, currentPoints) {
  $('editUserId').value = id;
  $('editUserName').value = username;
  $('editUserPoints').value = currentPoints;
  $('editPointsModal').classList.remove('hidden');
}

async function saveUserPoints() {
  const id = $('editUserId').value;
  const points = parseInt($('editUserPoints').value);
  if (isNaN(points) || points < 0) return alert('Số điểm không hợp lệ!');
  
  // Gọi API sửa điểm (chúng ta sẽ dùng API cộng/trừ điểm đã có sẵn)
  // Để ghi đè, ta cần biết số điểm hiện tại. Nhưng API cũ chỉ có cộng/trừ.
  // Tôi sẽ gửi một API mới (giả lập) để cập nhật trực tiếp, nếu server chưa có thì sẽ báo lỗi.
  // Tuy nhiên, để an toàn, tôi sẽ dùng cách xóa và tạo lại? Không, hãy dùng API admin/users/:id/points (đã có từ trước)
  
  // Lấy số điểm cũ từ giao diện
  const currentText = $('editUserPoints').getAttribute('data-old') || 0;
  // Tuy nhiên, ở đây ta đang muốn ghi đè trực tiếp, nên cần một API riêng.
  // Tôi sẽ sửa lại server.js để thêm API này (Xem hướng dẫn bên dưới).
  
  const r = await fetch('/api/admin/users/' + id + '/setpoints', {
    method: 'PUT',
    headers: { ...auth(), 'Content-Type':'application/json' },
    body: JSON.stringify({ points })
  });
  
  if (r.ok) { alert('Đã cập nhật số điểm!'); closeModal(); loadUsers(); } 
  else { alert('Lỗi cập nhật (Cần cập nhật server.js)'); }
}

function closeModal() { $('editPointsModal').classList.add('hidden'); }

// HÀM XÓA USER
async function delUser(id) {
  if(!confirm('CẢNH BÁO: Xóa tài khoản này sẽ xóa vĩnh viễn người dùng khỏi hệ thống. Bạn có chắc chắn?')) return;
  const r = await fetch('/api/admin/users/' + id, { method: 'DELETE', headers: auth() });
  if (r.ok) { alert('Đã xóa user!'); loadUsers(); } else { alert('Lỗi xóa!'); }
}

if (adToken) enterAdmin();
</script>
</body>
</html>
